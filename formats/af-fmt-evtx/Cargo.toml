[package]
name = "af-fmt-evtx"
description = "Windows event logs (EVTX) from bytes, on the evtx crate: records with their system fields and event data."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# evtx (MIT OR Apache-2.0), the version stage 1 compared with EvtxECmd (T3). No default
# features: no CLI, no threads (61 crates instead of 107).
evtx = { version = "=0.15.1", default-features = false }
serde_json = "1"
