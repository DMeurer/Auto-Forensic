[package]
name = "af-fmt-mft"
description = "NTFS $MFT records from bytes, on the mft crate: $STANDARD_INFORMATION and $FILE_NAME times as stored, names and paths."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# mft (MIT OR Apache-2.0), the version stage 1 compared with MFTECmd (T2). No default features:
# no mft_dump CLI.
mft = { version = "=0.9.2", default-features = false }
