[package]
name = "af-fuzz"
description = "Fuzz targets for the parsers and file system adapters (I25) and the format wrappers (O4). Run with `cargo +nightly fuzz run <target>`; see fuzz/README.md."
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Its own workspace: libFuzzer needs nightly and sanitizer flags the main build doesn't use.
[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
af-core = { path = "../crates/af-core" }
af-host = { path = "../crates/af-host" }
af-fmt-regf = { path = "../formats/af-fmt-regf" }
af-fs-archive = { path = "../fs/af-fs-archive" }
af-fs-ntfs = { path = "../fs/af-fs-ntfs" }
af-fmt-lnk = { path = "../formats/af-fmt-lnk" }
af-fmt-prefetch = { path = "../formats/af-fmt-prefetch" }
af-fmt-usn = { path = "../formats/af-fmt-usn" }
af-fmt-mft = { path = "../formats/af-fmt-mft" }
af-fmt-evtx = { path = "../formats/af-fmt-evtx" }
af-fmt-browser = { path = "../formats/af-fmt-browser" }
af-fmt-utmp = { path = "../formats/af-fmt-utmp" }
af-windows = { path = "../os/af-windows" }
serde_json = "1"

[[bin]]
name = "archive"
path = "fuzz_targets/archive.rs"
test = false
doc = false
bench = false

[[bin]]
name = "volumes"
path = "fuzz_targets/volumes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ntfs"
path = "fuzz_targets/ntfs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "regf"
path = "fuzz_targets/regf.rs"
test = false
doc = false
bench = false


