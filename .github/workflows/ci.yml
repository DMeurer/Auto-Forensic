name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Installs the toolchain pinned in rust-toolchain.toml, with rustfmt and clippy.
      - name: Toolchain
        run: rustup toolchain install
      # Keeps the compiled bundled DuckDB (af-store) between runs; without it each run rebuilds it.
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      # On failure, the first error lines become annotations, which anyone can read through the
      # API (the full log needs admin rights).
      - name: Lint
        shell: bash
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee lint.log
          s=${PIPESTATUS[0]}; [ $s -eq 0 ] || sed 's/\x1b\[[0-9;]*m//g' lint.log | grep -v '^ *Compiling\|^ *Checking' | tail -15 | sed 's/^/::error::/'; exit $s
      - name: Test
        shell: bash
        run: |
          cargo test --workspace --locked 2>&1 | tee test.log
          s=${PIPESTATUS[0]}; [ $s -eq 0 ] || sed 's/\x1b\[[0-9;]*m//g' test.log | grep -v '^ *Compiling\|^ *Checking' | tail -15 | sed 's/^/::error::/'; exit $s
      # Layer rules and the Windows-name scan (F1, F2). The test step above also checks
      # that a workspace with planted violations fails (xtask/fixtures/bad).
      - name: Layer rules
        run: cargo xtask check
