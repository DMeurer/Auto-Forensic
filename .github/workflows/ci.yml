name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Installs the toolchain pinned in rust-toolchain.toml, with rustfmt and clippy.
      - name: Toolchain
        run: rustup toolchain install
      # Keeps the compiled bundled DuckDB (af-store) between runs; without it each run rebuilds it.
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      # Layer rules and the Windows-name scan (F1, F2). The test step above also checks
      # that a workspace with planted violations fails (xtask/fixtures/bad).
      - name: Layer rules
        run: cargo xtask check
