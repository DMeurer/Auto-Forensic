[package]
name = "af-cli"
description = "The `af` command."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "af"
path = "src/main.rs"

[dependencies]
af-core.workspace = true
af-host.workspace = true
af-store.workspace = true
af-windows.workspace = true
af-linux.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
# Already in the tree through notatin; reads the attributes of user facts.
serde_json = "1.0.154"

[lints]
workspace = true

[dev-dependencies]
af-fmt-regf.workspace = true
af-fmt-utmp.workspace = true
tempfile = "3.27.0"
duckdb = { version = "=1.20000.1", default-features = false, features = ["bundled"] }
