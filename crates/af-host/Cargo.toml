[package]
name = "af-host"
description = "Everything that touches the machine the tool runs on: temp paths, opening a browser. One place, tested on Linux and Windows."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
af-core.workspace = true
tempfile = "3.27.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_IO", "Win32_System_Ioctl"] }

[dev-dependencies]
sha2 = "0.11.1"
