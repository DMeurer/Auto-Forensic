[workspace]
resolver = "3"
# The folder a crate sits in decides which layer rules apply to it (see README.md and `cargo xtask check`).
members = ["crates/*", "formats/*", "fs/*", "os/*", "xtask"]
exclude = ["xtask/fixtures"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
af-core = { path = "crates/af-core" }
af-host = { path = "crates/af-host" }
af-store = { path = "crates/af-store" }
af-windows = { path = "os/af-windows" }
af-fmt-regf = { path = "formats/af-fmt-regf" }
af-fmt-utmp = { path = "formats/af-fmt-utmp" }
af-fmt-volume = { path = "formats/af-fmt-volume" }
af-linux = { path = "os/af-linux" }
af-fs-ntfs = { path = "fs/af-fs-ntfs" }
af-fs-archive = { path = "fs/af-fs-archive" }

# No debug info for dependencies: the bundled DuckDB with it filled a 79 GB disk (24 GB target).
[profile.dev.package."*"]
debug = false

[workspace.lints.rust]
# deny, not forbid: af-host may allow it for OS calls, and `cargo xtask check` keeps it there.
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
print_stdout = "warn"
