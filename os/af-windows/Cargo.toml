[package]
name = "af-windows"
description = "The Windows OS profile and Windows artifact plugins. The only place outside format crates that may name HKLM, drive letters or FILETIME."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
af-core.workspace = true
af-fmt-evtx.workspace = true
af-fmt-lnk.workspace = true
af-fmt-mft.workspace = true
af-fmt-prefetch.workspace = true
af-fmt-usn.workspace = true
# Scheduled task XML (X4, the user's choice): a read-only tree, pure Rust, no dependencies.
roxmltree = "0.20"
af-fmt-regf.workspace = true
# YAML for event log maps (E3; user's choice): pure Rust, built not to panic, with budgets
# against hostile input.
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "2.1.1", default-features = false, features = ["deserialize"] }
regex = "1"
serde_json = "1"

[lints]
workspace = true
